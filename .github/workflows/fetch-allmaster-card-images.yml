name: Fetch ALLMASTER card images

on:
  push:
    paths:
      - '.github/workflows/fetch-allmaster-card-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch source images from Firestorage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge

          fetch_image() {
            share_id="$1"
            file_id="$2"
            output="$3"
            response="$(curl -fsSL -X POST "https://api.firestorage.ai/dev/file/shares/${share_id}/files/${file_id}/download")"
            download_url="$(printf '%s' "$response" | jq -r '.downloadUrl')"
            test -n "$download_url"
            test "$download_url" != "null"
            curl -fL "$download_url" -o "$output"
            test -s "$output"
          }

          fetch_image 'lwItS-t9olyq' '01a09e00f38372eebd32fec0855f4ff4' 'bridge/allmaster-card-presenca-digital.png'
          fetch_image '9hWPP4AK6PxK' '01a09e0148b470efb4f973eb4fb89d18' 'bridge/allmaster-card-marca-conteudo.png'
          fetch_image 'P3l63-mMjj5R' '01a09e017d567510844a60060f27d39c' 'bridge/allmaster-card-solucoes-digitais.png'
          fetch_image 'J3Abpx8h4MKf' '01a09e01af6970d4919ac30c1ad9288d' 'bridge/allmaster-card-event-tech.png'

      - name: Commit temporary bridge files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'allmasteronline-dev'
          git config user.email 'allmasteronline@gmail.com'
          git add bridge
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add temporary ALLMASTER card image bridge'
          git push
